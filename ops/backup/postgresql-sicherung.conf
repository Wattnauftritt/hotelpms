# /etc/postgresql/17/main/conf.d/hotelpms-sicherung.conf
#
# WAL-Archivierung fuer pgBackRest (Backupstrategie, Schicht 1). Damit laesst
# sich die Datenbank auf jeden Zeitpunkt der letzten 14 Tage zurueckspielen,
# nicht nur auf die letzte Nacht. Ein Tag Verlust hiesse: Check-ins,
# Zahlungen und Rechnungen von Papier nachtragen, und eine Rechnungsnummer,
# die schon beim Gast liegt, wuerde ein zweites Mal vergeben.
#
# archive_mode braucht einen Neustart von PostgreSQL, kein Reload.

wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=hotelpms archive-push %p'

# Spaetestens jede Minute eine WAL-Datei abschliessen, auch wenn sie nicht
# voll ist. Ohne das wartet ein ruhiges Haus nachts Stunden, bis 16 MB
# zusammen sind, und genau diese Stunden fehlen nach einem Ausfall.
archive_timeout = 60

# Die Wiederherstellungspunkte, die deploy.sh vor jeder Migration setzt,
# kosten nichts; max_wal_senders bleibt fuer pgBackRest auf der Vorgabe.
