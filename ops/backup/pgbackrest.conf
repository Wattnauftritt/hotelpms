# /etc/pgbackrest/pgbackrest.conf
#
# Schicht 1 der Backupstrategie: laufend nach IONOS Object Storage,
# Frankfurt (Sven, 15.10.2026). Die Zugangsdaten stehen NICHT hier, sondern
# in /etc/pgbackrest/conf.d/geheim.conf (Vorlage: geheim.conf.vorlage),
# chmod 600, Eigentuemer postgres. Diese Datei darf jeder lesen, der auf der
# Maschine ist; die andere nicht.

[global]
repo1-type=s3
# IONOS Object Storage, Frankfurt, Bucket im Besitz des Vertrags
# (contract-owned). Endpunkt und Region beim Anlegen des Buckets im
# Data Center Designer nachsehen und hier eintragen, falls sie abweichen
# (Berlin: eu-central-3).
repo1-s3-endpoint=s3.eu-central-4.ionoscloud.com
repo1-s3-region=eu-central-4
# Bucket-Namen sind ueber alle Kunden eindeutig. Ist der Name
# vergeben, einen anderen waehlen und hier eintragen.
repo1-s3-bucket=staygrid-pgbackrest
repo1-s3-uri-style=path
repo1-path=/hotelpms

# Verschluesselt, bevor es die Maschine verlaesst. Die Passphrase steht in
# geheim.conf und zusaetzlich im Passwortspeicher: ohne sie ist das ganze
# Repository wertlos.
repo1-cipher-type=aes-256-cbc

# Aufbewahrung: zwei Vollsicherungen. Bei woechentlicher Vollsicherung
# reicht die Rueckspielung damit 14 bis 21 Tage zurueck. Mehr ist fuer
# Gastdaten nicht noetig und nicht erwuenscht (Plan §4); was laenger
# gebraucht wird, liegt in Schicht 2 und im Jahresarchiv.
repo1-retention-full=2

compress-type=zst
process-max=2
start-fast=y
log-level-console=info
log-level-file=detail

[hotelpms]
pg1-path=/var/lib/postgresql/17/main
