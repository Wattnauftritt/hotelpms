# Nach /etc/systemd/journald.conf.d/hotelpms.conf, dann
#   sudo systemctl restart systemd-journald
#
# **Dreissig Tage, dann weg** (Bedrohungsanalyse 23.10.2026, E1). Seit dem
# 24.10.2026 steht in jeder Protokollzeile der API die volle IP-Adresse des
# Aufrufers (`apps/api/src/platform/abrufmenge.ts`). Ungekuerzt, weil eine
# Anzeige und eine Sperre die volle Adresse brauchen (Sven, 23.10.2026) --
# aber nicht laenger, als ein Vorfall braucht, um aufzufallen. Was
# auffaellt, steht als Sicherheitsereignis in der Datenbank und lebt dort
# nach dessen Fristen (180 Tage voll, Migration 0209).
#
# Fuer das ganze Journal, nicht nur fuer die Dienste von StayGrid: journald
# kennt keine Frist je Unit. Auf dieser Maschine laeuft nichts anderes, dessen
# Protokoll laenger gebraucht wuerde; Caddy schreibt kein Zugriffsprotokoll.
[Journal]
MaxRetentionSec=30day
