name: App-Freigabe
# Signiert die App und laedt sie in den internen Test der Stores (Plan
# app/plan.md, Baustein 3): Android in den internen Test von Google Play,
# iOS zu TestFlight.
#
# Hochgeladen wird nur bei einem Tag `app-v…` oder von Hand mit
# `hochladen`. Ein Pull Request, der diesen Lauf aendert, baut und signiert
# nur: er beweist, dass die Schluessel passen, ohne Google oder Apple eine
# Fassung zu schicken. Oeffentlich wird nichts von hier aus; das ist der
# Klick in der Play Console und in App Store Connect.
#
# Den allerersten Upload einer App nimmt Google nur in der Play Console an.
# Dafuer liegt das signierte Bundle jedes Laufs als Artefakt bereit.
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      hochladen:
        description: In den internen Test von Google Play und zu TestFlight hochladen
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/app-freigabe.yml'
      - 'apps/mobile/android/app/build.gradle'
      - 'apps/mobile/scripts/play.mjs'
      - 'apps/mobile/ios/App/App.xcodeproj/**'
      - 'apps/mobile/ios/App/App/AppDelegate.swift'

concurrency:
  group: app-freigabe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    # Secrets erreichen einen Pull Request aus einem fremden Fork nicht;
    # dort waere der Lauf nur rot.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      # Ohne oeffentlichen Schluessel baut die App ohne Aktualisierung vom
      # Server (capacitor.config.ts). Zum Ausprobieren in einem Pull Request
      # geht das; in den Store soll so keine, denn jede Fassung dort bliebe
      # fuer immer ohne -- bis zur naechsten aus dem Store.
      - name: Schluessel fuer Pakete pruefen
        if: startsWith(github.ref, 'refs/tags/app-v') || inputs.hochladen
        run: |
          test -s apps/mobile/paket-schluessel.pem || {
            echo "::error::apps/mobile/paket-schluessel.pem fehlt (deploy.sh app-schluessel)"; exit 1; }
      # Firebase fuer die Benachrichtigungen der Personal-App (0193). Ohne
      # die Datei wendet build.gradle das Plugin nicht an, und die Huelle
      # meldet `push: false` -- die App laeuft, nur ohne Benachrichtigungen.
      # Die Datei ist kein Geheimnis im engeren Sinn (sie steckt in jeder
      # ausgelieferten App), aber sie nennt das Projekt und gehoert nicht
      # ins Repository.
      - name: Firebase einrichten
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json
            node -e 'const j=require("./apps/mobile/android/app/google-services.json"); if (!j.client?.some(c => c.client_info?.android_client_info?.package_name === "cloud.staygrid.app")) { console.error("::error::google-services.json kennt cloud.staygrid.app nicht"); process.exit(1) }'
          else
            echo "::warning::Secret FIREBASE_GOOGLE_SERVICES_JSON fehlt: App ohne Benachrichtigungen"
          fi
      - name: Oberflaeche und Bruecke zusammensetzen
        working-directory: apps/mobile
        run: pnpm sync
      # Google nimmt jede Fassungsnummer nur einmal und verlangt sie
      # steigend. Die Laufnummer steigt von selbst; der Versatz liegt ueber
      # allem, was von Hand gebaut wurde (dort ist sie 1).
      - name: Fassung bestimmen
        id: fassung
        run: |
          code=$((100 + GITHUB_RUN_NUMBER))
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            name="${GITHUB_REF#refs/tags/app-v}"
          else
            name="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Fassung $name ($code)"
      - name: Upload-Schluessel auspacken
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Secret ANDROID_UPLOAD_KEYSTORE_B64 fehlt"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Android signiert bauen
        working-directory: apps/mobile/android
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          STAYGRID_VERSION_CODE: ${{ steps.fassung.outputs.code }}
          STAYGRID_VERSION_NAME: ${{ steps.fassung.outputs.name }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon bundleRelease
      # Ohne Schluessel baut Gradle still unsigniert; Google wiese das
      # Bundle erst beim Hochladen ab. Hier faellt es sofort auf.
      - name: Signatur pruefen
        run: |
          aab=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          "$JAVA_HOME_21_X64/bin/jarsigner" -verify "$aab" | tee /dev/stderr | grep -q 'jar verified'
          cp "$aab" "$RUNNER_TEMP/staygrid-${{ steps.fassung.outputs.name }}.aab"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: staygrid-android-${{ steps.fassung.outputs.name }}
          path: ${{ runner.temp }}/staygrid-${{ steps.fassung.outputs.name }}.aab
          retention-days: 30
      - name: In den internen Test hochladen
        if: startsWith(github.ref, 'refs/tags/app-v') || inputs.hochladen
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play.mjs "$RUNNER_TEMP/staygrid-${{ steps.fassung.outputs.name }}.aab" "${{ steps.fassung.outputs.name }}"
      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" apps/mobile/android/app/google-services.json

  ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      - name: Schluessel fuer Pakete pruefen
        if: startsWith(github.ref, 'refs/tags/app-v') || inputs.hochladen
        run: |
          test -s apps/mobile/paket-schluessel.pem || {
            echo "::error::apps/mobile/paket-schluessel.pem fehlt (deploy.sh app-schluessel)"; exit 1; }
      # Wie google-services.json bei Android: ohne die Datei startet die App
      # Firebase nicht und bietet keine Benachrichtigungen an (AppDelegate).
      - name: Firebase einrichten
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          ziel=apps/mobile/ios/App/App/GoogleService-Info.plist
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > "$ziel"
            test "$(plutil -extract BUNDLE_ID raw "$ziel")" = cloud.staygrid.app || {
              echo "::error::GoogleService-Info.plist gehoert nicht zu cloud.staygrid.app"; exit 1; }
          else
            echo "::warning::Secret FIREBASE_GOOGLE_SERVICE_INFO_PLIST fehlt: App ohne Benachrichtigungen"
          fi
      - name: Oberflaeche und Bruecke zusammensetzen
        working-directory: apps/mobile
        run: pnpm sync
      # Dieselbe Rechnung wie bei Android, damit beide Stores dieselbe
      # Nummer fuer denselben Lauf zeigen. Apple verlangt drei Zahlen.
      - name: Fassung bestimmen
        id: fassung
        run: |
          code=$((100 + GITHUB_RUN_NUMBER))
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            name="${GITHUB_REF#refs/tags/app-v}"
          else
            name="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Fassung $name ($code)"
      # Kein Zertifikat und kein Profil im Repository oder in den Secrets:
      # mit dem API-Schluessel legt Xcode beides selbst an und verwaltet das
      # Verteilungszertifikat bei Apple (cloud signing).
      - name: API-Schluessel auspacken
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for n in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_TEAM_ID; do
            test -n "${!n}" || { echo "::error::Secret $n fehlt"; exit 1; }
          done
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: iOS signiert bauen
        working-directory: apps/mobile/ios/App
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -version
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ steps.fassung.outputs.code }}" \
            MARKETING_VERSION="${{ steps.fassung.outputs.name }}"
      # `destination upload` schickt das Archiv selbst zu App Store Connect;
      # ohne Hochladen entsteht nur die .ipa, und der Lauf beweist, dass die
      # Signatur fuer den Store taugt.
      - name: Exportieren und zu TestFlight hochladen
        working-directory: apps/mobile/ios/App
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HOCHLADEN: ${{ startsWith(github.ref, 'refs/tags/app-v') || inputs.hochladen }}
        run: |
          ziel=export; [ "$HOCHLADEN" = true ] && ziel=upload
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$ziel</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" apps/mobile/ios/App/App/GoogleService-Info.plist
